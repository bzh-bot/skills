<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- The mascot presenter — flat vector, hand-editable. See steps/5-avatar.md.
       Contract: 240x240 card; mouth centre (120,142) inside a 26x24 band; nine
       viseme-X..H groups on one baseline (exactly one visible); and an
       #eyes-open / #eyes-closed pair the frames script toggles to blink. -->
  <g id="avatar">
    <g id="card">
      <rect id="card-fill" x="6" y="6" width="228" height="228" rx="30"
            fill="#0C1016" fill-opacity="0.66"/>
      <rect id="card-ring" x="6" y="6" width="228" height="228" rx="30" fill="none"
            stroke="#6FD6C6" stroke-width="2.2" stroke-opacity="0.5"/>
    </g>

    <g id="body">
      <path id="shirt" d="M 34 233 C 38 209, 63 195, 96 189 L 106 186
                           C 110 199, 130 199, 134 186 L 144 189
                           C 177 195, 202 209, 206 233 Z" fill="#25867C"/>
      <path id="collar" d="M 95 188 L 120 206 L 145 188 L 151 193 L 124 213 L 116 213 L 89 193 Z"
            fill="#35AA9C"/>
    </g>

    <g id="head">
      <path id="ears" d="M 118 52 L 118 32 M 122 52 L 122 32" stroke="#2A9E90"
            stroke-width="5" fill="none"/>
      <circle id="ear-tip" cx="120" cy="27" r="8" fill="#FFC857"/>

      <rect id="head-shape" x="58" y="50" width="124" height="134" rx="38" fill="#3BBFAE"/>
      <path id="head-shade" d="M 62 152 C 66 174, 80 186, 104 189 C 80 192, 62 178, 58 154
                              C 58 140, 59 130, 62 122 C 62 133, 61 142, 62 152 Z"
            fill="#2A9E90" fill-opacity="0.32"/>
      <path id="head-lite" d="M 74 84 C 79 62, 96 51, 120 51 C 144 51, 161 62, 166 84
                              C 158 68, 142 59, 120 59 C 98 59, 82 68, 74 84 Z"
            fill="#63D3C4" fill-opacity="0.55"/>

      <g id="eyes-open" visibility="visible">
        <g id="eyes">
          <g id="eye-left">
            <ellipse id="sclera-left" cx="95" cy="108" rx="17" ry="19" fill="#F7FBFA"/>
            <circle id="iris-left" cx="97" cy="110" r="10" fill="#12303A"/>
            <circle id="pupil-left" cx="97" cy="110" r="4.8" fill="#0A1A21"/>
            <circle id="highlight-left" cx="93" cy="104" r="4.2" fill="#FFFFFF" fill-opacity="0.95"/>
          </g>
          <g id="eye-right">
            <ellipse id="sclera-right" cx="145" cy="108" rx="17" ry="19" fill="#F7FBFA"/>
            <circle id="iris-right" cx="143" cy="110" r="10" fill="#12303A"/>
            <circle id="pupil-right" cx="143" cy="110" r="4.8" fill="#0A1A21"/>
            <circle id="highlight-right" cx="139" cy="104" r="4.2" fill="#FFFFFF" fill-opacity="0.95"/>
          </g>
        </g>
      </g>

      <g id="eyes-closed" visibility="hidden">
        <g id="eyes-shut">
          <path id="lid-left" d="M 81 110 C 88 103, 102 103, 109 110 C 102 114, 88 114, 81 110 Z"
                fill="#1A6B64"/>
          <path id="lid-right" d="M 131 110 C 138 103, 152 103, 159 110 C 152 114, 138 114, 131 110 Z"
                fill="#1A6B64"/>
        </g>
      </g>

      <g id="brows">
        <path id="brow-left" d="M 79 86 C 87 79, 101 79, 109 85 L 108 92
                                C 100 87, 88 87, 80 93 Z" fill="#1A6B64"/>
        <path id="brow-right" d="M 161 86 C 153 79, 139 79, 131 85 L 132 92
                                 C 140 87, 152 87, 160 93 Z" fill="#1A6B64"/>
      </g>

      <g id="mouth">
      <g id="viseme-X" visibility="visible">
        <path d="M 106.2 139.8 C 109.6 146.8, 130.4 146.8, 133.8 139.8 C 130.6 143.6, 109.4 143.6, 106.2 139.8 Z" fill="#0E2A30"/>
      </g>
      <g id="viseme-A" visibility="hidden">
        <path d="M 108.35 139.8 C 111.75 145, 128.25 145, 131.65 139.8 C 128.45 143, 111.55 143, 108.35 139.8 Z" fill="#0E2A30"/>
      </g>
      <g id="viseme-B" visibility="hidden">
        <ellipse cx="120" cy="142" rx="9.89" ry="4.08" fill="#0E2A30"/>
      </g>
      <g id="viseme-C" visibility="hidden">
        <ellipse cx="120" cy="142" rx="11.18" ry="7.1" fill="#0E2A30"/>
      </g>
      <g id="viseme-D" visibility="hidden">
        <ellipse cx="120" cy="142" rx="12.04" ry="10.32" fill="#0E2A30"/>
        <ellipse cx="120" cy="139.11" rx="7.46" ry="3.51" fill="#8FE6D8" fill-opacity="0.9"/>
      </g>
      <g id="viseme-E" visibility="hidden">
        <ellipse cx="120" cy="142" rx="8.6" ry="8.17" fill="#0E2A30"/>
      </g>
      <g id="viseme-F" visibility="hidden">
        <ellipse cx="120" cy="142" rx="9.46" ry="3.66" fill="#0E2A30"/>
        <ellipse cx="120" cy="140.98" rx="5.87" ry="1.24" fill="#8FE6D8" fill-opacity="0.9"/>
      </g>
      <g id="viseme-G" visibility="hidden">
        <ellipse cx="120" cy="142" rx="7.31" ry="4.95" fill="#0E2A30"/>
        <ellipse cx="120" cy="140.62" rx="4.53" ry="1.68" fill="#8FE6D8" fill-opacity="0.9"/>
      </g>
      <g id="viseme-H" visibility="hidden">
        <ellipse cx="120" cy="142" rx="10.32" ry="2.79" fill="#0E2A30"/>
        <ellipse cx="120" cy="141.22" rx="6.4" ry="0.95" fill="#8FE6D8" fill-opacity="0.9"/>
      </g>
      </g>
    </g>
  </g>
</svg>
